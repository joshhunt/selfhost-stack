networks:
  download-clients:
    name: download-clients
  traefik:
    name: traefik
  overseerr:
    name: overseerr

secrets:
  porkbun-api-key:
    file: $CONFIG_PATH/secrets/porkbun_api_key.txt
  porkbun-secret-key:
    file: $CONFIG_PATH/secrets/porkbun_secret_key.txt

services:
  #
  # Prowlarr - index aggregator
  #
  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:latest
    ports:
      - 9696:9696
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - UMASK=002
    volumes:
      - $CONFIG_PATH/prowlarr:/config:rw
    networks:
      - traefik
    labels:
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.trtr.co`)"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: curl -fSs http://127.0.0.1:9696 > /dev/null || exit 1
      start_period: 20s
      timeout: 5s
      interval: 5s
      retries: 3
    restart: unless-stopped

  #
  # Radarr - Movies Search
  #
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    # ports:
    #   - 7878:7878
    environment:
      - UMASK_SET=22
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $CONFIG_PATH/radarr:/config
      - $DATA_PATH:/data
    networks:
      - download-clients
      - traefik
      - overseerr
    labels:
      - "traefik.http.routers.radarr.rule=Host(`radarr.trtr.co`)"
      # - "traefik.http.routers.radarr.tls.certresolver=wildcard"
      # - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: curl -fSs http://127.0.0.1:7878 > /dev/null || exit 1
      start_period: 20s
      timeout: 5s
      interval: 5s
      retries: 3
    restart: unless-stopped
    entrypoint:
      - /init
    depends_on:
      sabnzbd:
        condition: service_healthy

  #
  # Sonarr - Show Search
  #
  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    ports:
      - 8989:8989
    environment:
      - UMASK_SET=22
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $CONFIG_PATH/sonarr:/config
      - $DATA_PATH:/data
    networks:
      - download-clients
      - traefik
      - overseerr
    labels:
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.trtr.co`)"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: curl -fSs http://127.0.0.1:8989 || exit 1
      start_period: 90s
      timeout: 5s
      interval: 5s
      retries: 3
    restart: "unless-stopped"
    entrypoint:
      - /init
    depends_on:
      sabnzbd:
        condition: service_healthy

  #
  # Bazarr - subtitles search
  #
  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr:latest
    ports:
      - 6767:6767
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - UMASK_SET=022 #optional
    volumes:
      - $CONFIG_PATH/bazarr:/config
      - $DATA_PATH:/data
    networks:
      - traefik
    labels:
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.trtr.co`)"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: curl -fSs http://127.0.0.1:6767 > /dev/null || exit 1
      start_period: 60s
      timeout: 5s
      interval: 5s
      retries: 3
    restart: unless-stopped
    # mem_limit: 300M
    # mem_reservation: 250M

  #
  # Sabnzbd - Usenet downloader
  #
  sabnzbd:
    container_name: sabnzbd
    image: linuxserver/sabnzbd
    ports:
      - 8080:8080
      - 9090:9090
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $CONFIG_PATH/sabnzbd:/config
      - $DATA_PATH:/data
    networks:
      - download-clients
      - traefik
    labels:
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.trtr.co`)"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: curl -fSs 127.0.0.1:8080 > /dev/null || exit 1
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - $CONFIG_PATH/overseerr:/config
    networks:
      - overseerr
      - traefik
    labels:
      - "traefik.http.routers.overseerr.rule=Host(`overseerr.trtr.co`)"
      - "traefik.docker.network=traefik"
    restart: unless-stopped

  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome
    # network_mode: "host"
    ports:
      # Plain DNS
      - "53:53/tcp"
      - "53:53/udp"
      # AdGuard Home Admin Panel as well as DNS-over-HTTPS
      # - "81:81/tcp" - exposed by traefik now
      # - "443:443/tcp"
      - "443:443/udp"
      # - "3000:3000/tcp"
      # DNS-over-TLS
      - "853:853/tcp"
      # DNS-over-QUIC
      - "784:784/udp"
      - "853:853/udp"
      - "8853:8853/udp"
      # DNSCrypt
      - "5443:5443/tcp"
      - "5443:5443/udp"
    networks:
      - traefik
    labels:
      - "traefik.http.routers.adguardhome.rule=Host(`adguard.trtr.co`)"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.adguardhome.loadbalancer.server.port=81"
    volumes:
      - $CONFIG_PATH/adguardhome/config:/opt/adguardhome/conf # app configuration
      - $CONFIG_PATH/adguardhome/work:/opt/adguardhome/work # app working directory

  traefik:
    container_name: traefik
    image: traefik:v3.2
    # Enables the web UI and tells Traefik to listen to docker
    command:
      - "--providers.docker"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.domains[0].main=*.trtr.co"
      - "--certificatesresolvers.wildcard.acme.dnschallenge=true"
      - "--certificatesresolvers.wildcard.acme.dnschallenge.provider=porkbun"
      - "--certificatesresolvers.wildcard.acme.email=letsencrypt@trtr.co"
      - "--certificatesresolvers.wildcard.acme.storage=/letsencrypt/acme.json"
    networks:
      - traefik
    ports:
      # Web server ports
      - "80:80"
      - "443:443"
      # The Web UI (enabled by --api.insecure=true)
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $CONFIG_PATH/traefik/letsencrypt:/letsencrypt
    environment:
      - PORKBUN_API_KEY_FILE=/run/secrets/porkbun-api-key
      - PORKBUN_SECRET_API_KEY_FILE=/run/secrets/porkbun-secret-key
    secrets:
      - porkbun-api-key
      - porkbun-secret-key

  whoami:
    container_name: whoami
    # A container that exposes an API to show its IP address
    image: traefik/whoami
    networks:
      - traefik
    labels:
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.whoami.rule=Host(`whoami.trtr.co`)"
      - "traefik.http.routers.whoami.tls.certresolver=wildcard"
      - "traefik.http.routers.whoami.entrypoints=websecure"
