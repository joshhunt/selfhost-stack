services:
  #
  # Radarr - Movies Search
  #
  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    environment:
      - UMASK_SET=22
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $CONFIG_PATH/radarr:/config
      - $DATA_PATH:/data
    networks:
      - sabnzbd
      - traefik
      - bazarr
      - overseerr
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.rule=Host(`radarr.trtr.co`)"
    healthcheck:
      test: curl -fSs http://127.0.0.1:7878 > /dev/null || exit 1
      start_period: 20s
      timeout: 5s
      interval: 5s
      retries: 3
    restart: unless-stopped
    entrypoint:
      - /init
    depends_on:
      sabnzbd:
        condition: service_healthy
