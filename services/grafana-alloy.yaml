services:
  grafana-alloy:
    container_name: grafana-alloy
    image: grafana/alloy:latest
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    networks:
      - traefik
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--disable-reporting"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--stability.level=experimental"
    volumes:
      - grafana-alloy-data:/var/lib/alloy
      - ${PWD}/grafana-alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.alloy.entrypoints=websecure"
      - "traefik.http.routers.alloy.rule=Host(`alloy.trtr.co`)"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
      - "com.centurylinklabs.watchtower.enable=true"
    secrets:
      - grafana-alloy-token
      - grafana-alloy-loki-url
      - grafana-alloy-loki-user
      - grafana-alloy-prom-url
      - grafana-alloy-prom-user

volumes:
  grafana-alloy-data:
