services:
  #
  # Sabnzbd - Usenet downloader
  #
  sabnzbd:
    container_name: sabnzbd
    image: linuxserver/sabnzbd
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - sabnzbd-config:/config
      - type: bind
        source: $DATA_PATH
        target: /data
    networks:
      - sabnzbd
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.sab.entrypoints=websecure"
      - "traefik.http.routers.sab.rule=Host(`sab.trtr.co`)"
      - "com.centurylinklabs.watchtower.enable=true"
      - "docker-volume-backup.stop-during-backup=true"
    healthcheck:
      test: curl -fSs 127.0.0.1:8080 > /dev/null || exit 1
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  sabnzbd-config:
