services:
  scraparr:
    image: ghcr.io/thecfu/scraparr
    container_name: scraparr
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - UMASK_SET=22
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.scraparr.entrypoints=websecure"
      - "traefik.http.routers.scraparr.rule=Host(`scraparr.trtr.co`)"
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - $CONFIG_PATH/scraparr/config.yaml:/scraparr/config/config.yaml
      - type: bind
        source: $DATA_PATH
        target: /data
    networks:
      - scraparr
      - traefik
    depends_on:
      radarr:
        condition: service_healthy
        restart: true
      sonarr:
        condition: service_healthy
        restart: true
      prowlarr:
        condition: service_healthy
        restart: true
