#
# Watchtower - updates docker containers
#
services:
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--interval=3600"
      - "--label-enable"
      - "--cleanup"
